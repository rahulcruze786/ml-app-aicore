apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: dummy-ml-model
  labels:
    scenarios.ai.sap.com/id: "ml-scenario"
    executables.ai.sap.com/id: "ml-serving"
    ai.sap.com/version: "1.0.0"
  annotations:
    executables.ai.sap.com/name: "dummy-ml-model"
spec:
  template:
    apiVersion: serving.kserve.io/v1beta1
    kind: InferenceService
    metadata:
      name: dummy-ml-model
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "1"
        autoscaling.knative.dev/targetBurstCapacity: "0"
    spec: |
      predictor:
        containers:
          - name: kserve-container
            image: docker.io/rahulcruze786/ml-app:0.0.1
            ports:
              - containerPort: 9002
                protocol: TCP
            env:
              - name: STORAGE_URI
                value: "nonexistent"
